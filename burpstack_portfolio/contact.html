<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contact Aprajita Mrinal about projects and learning opportunities.">
    <title>Contact | Aprajita's Portfolio</title>
</head>
<body>
    <header>
        <h1>Contact Me</h1>
        <nav aria-label="Main navigation">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="projects.html">Projects</a></li>
                <li><a href="contact.html" aria-current="page">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section aria-labelledby="contact-heading">
            <h2 id="contact-heading">Let's connect</h2>
            <p>Use this form's structure to practise accessible HTML forms. It will not send messages until a backend or form service is connected.</p>

            <form action="#" method="post">
                <div>
                    <label for="Aprajita Mrinal">Name</label>
                    <input type="text" id="Aprajita Mrinal" name="Aprajita Mrinal" autocomplete="Aprajita Mrinal" required>
                </div>

                <div>
                    <label for="aparajitamrinal@gmail.com">Email address</label>
                    <input type="email" id="aparajitamrinal@gmail.com" name="aparajitamrinal@gmail.com" autocomplete="aparajitamrinal@gmail.com" required>
                </div>

                <div>
                    <label for="project">Project</label>
                    <input type="text" id="project" name="project" maxlength="120" required>
                </div>

                <div>
                    <label for="hello">Message</label>
                    <textarea id="hello" name="hello" rows="6" maxlength="2000" required></textarea>
                </div>

                <button type="submit">Submit Message</button>
            </form>
        </section>
    </main>

    <footer>
        <p><a href="index.html">Back to Home</a> | &copy; 2026 Aprajita Mrinal</p>
    </footer>
</body>
</html>
